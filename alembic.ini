# Alembic configuration
# For asyncpg, we use a sync driver for migrations (postgresql+psycopg2)
# because Alembic's command-line tools work better with sync connections.
# In production, you can also run migrations inside the API container:
#   alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# We override this via env.py reading DATABASE_URL from settings
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
