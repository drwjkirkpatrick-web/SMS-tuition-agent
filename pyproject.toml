# ═══════════════════════════════════════════════════
# pyproject.toml — Project metadata & tool config
# ═══════════════════════════════════════════════════
# 
# This file tells Python tooling (pip, uv, ruff, mypy) how to treat
# our project. We use PEP 621 format (modern standard).
#
# ARM64 NOTE: We pin versions known to have ARM64 wheels so Docker
# builds on Raspberry Pi / Jetson don't compile from source.
# ═══════════════════════════════════════════════════

[project]
name = "sms-tuition-agent"
version = "0.1.0"
description = "SMS-first school tuition reminder and payment agent"
readme = "README.md"
requires-python = ">=3.11"
# Python 3.11 is the sweet spot for ARM64 — 3.12+ sometimes lacks
# wheels for niche packages on aarch64.

dependencies = [
    # Web framework
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<0.35",
    "python-multipart>=0.0.9",      # form parsing for webhooks

    # Background tasks
    "celery[redis]>=5.4,<5.5",      # task queue with Redis broker

    # Database
    "sqlalchemy[asyncio]>=2.0,<2.1", # ORM with async support
    "asyncpg>=0.29,<0.30",           # async PostgreSQL driver
    "alembic>=1.13,<1.14",           # database migrations

    # Validation / settings
    "pydantic>=2.7,<2.11",
    "pydantic-settings>=2.2,<2.8",
    "email-validator>=2.1,<2.3",     # guardian email validation

    # SMS
    "twilio>=9.0,<9.4",              # Twilio SDK

    # Security
    "python-jose[cryptography]>=3.3,<3.4",  # token signing
    "passlib[bcrypt]>=1.7,<1.8",     # password hashing (admin tokens)
    "cryptography>=42.0,<44.0",      # encryption helpers

    # Timezone
    "zoneinfo>=0.2.1;python_version<'3.9'",  # backport (not needed on 3.11)

    # Observability
    "structlog>=24.1,<25.0",         # structured logging (JSON)
    "prometheus-client>=0.20,<0.22",  # metrics endpoint

    # Utilities
    "httpx>=0.27,<0.29",             # async HTTP client
    "tenacity>=8.2,<9.0",            # retry decorators
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<0.25",
    "pytest-cov>=5.0,<6.0",
    "factory-boy>=3.3,<3.4",         # test data factories
    "faker>=25.0,<26.0",             # fake names/phones
    "ruff>=0.4,<0.6",               # linter + formatter (fast Rust)
    "mypy>=1.10,<1.12",              # static type checking
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
